[platformio]
; "pio run" sem -e compila so os firmwares de verdade (o native e para "pio test -e native")
default_envs = esp32dev, vent01

[base]
platform = espressif32
board = esp32dev
framework = arduino
; velocidade da comunicação serial ("console" de debug)
monitor_speed = 115200
; as libs em lib/ precisam enxergar o include/ do projeto (secrets.h)
build_flags = -I$PROJECT_INCLUDE_DIR

; ---------------------------------------------------------------------------
; CF-01 (caixa que mede). Gravar: pio run -e esp32dev -t upload
; ---------------------------------------------------------------------------
[env:esp32dev]
extends = base
build_src_filter = +<*> -<vent01/> -<vent01_teste/> -<cf01_teste/>
build_flags = ${base.build_flags} -DDEVICE_ID=\"CF-01\" -DDEVICE_CF01
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8

; ---------------------------------------------------------------------------
; VENT-01 (estacao de ventilacao). Gravar: pio run -e vent01 -t upload
; Rele: open-drain simulado (ligar = OUTPUT+LOW, desligar = INPUT), ver PINAGEM.md.
; ---------------------------------------------------------------------------
[env:vent01]
extends = base
build_src_filter = -<*> +<vent01/>
build_flags = ${base.build_flags} -DDEVICE_ID=\"VENT-01\" -DDEVICE_VENT01
lib_deps =
    knolleary/PubSubClient@^2.8

; ---------------------------------------------------------------------------
; OTA (R17): grava sem cabo. A senha vem da variavel de ambiente OTA_PASSWORD
; (a mesma do secrets.h). Exemplo (PowerShell):
;   $env:OTA_PASSWORD = "..."; pio run -e cf01_ota -t upload
; Se o mDNS (CF-01.local) nao resolver na rede, troque upload_port pelo IP.
; ---------------------------------------------------------------------------
[env:cf01_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = CF-01.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:vent01_ota]
extends = env:vent01
upload_protocol = espota
upload_port = VENT-01.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

; ---------------------------------------------------------------------------
; VENT-01: programa de teste do rele (so GPIO 23, sem rede).
; Gravar: pio run -e vent01_teste -t upload
; ---------------------------------------------------------------------------
[env:vent01_teste]
extends = base
build_src_filter = -<*> +<vent01_teste/>

; ---------------------------------------------------------------------------
; CF-01: programa de teste de bancada (DHT11, tampa, reset, buzzer, LED RGB,
; rele de 2 canais; so Serial, sem rede). Gravar: pio run -e cf01_teste -t upload
; ---------------------------------------------------------------------------
[env:cf01_teste]
extends = base
build_src_filter = -<*> +<cf01_teste/>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ---------------------------------------------------------------------------
; Testes de logica pura no PC (precisa de compilador C++ no PATH, ex. MinGW):
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=gnu++11
lib_ldf_mode = chain+
