; Dois alvos com o MESMO codigo-fonte:
;   esp32dev -> placa fisica na bancada (DHT11 do kit)
;   wokwi    -> simulacao (o Wokwi nao tem peca DHT11; usa DHT22)
; Compilar a simulacao com:  pio run -e wokwi

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino

; velocidade da comunicação serial ("console" de debug)
monitor_speed = 115200

; bibliotecas do projeto
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8

[env:esp32dev]

[env:wokwi]
build_flags = -D SIM_WOKWI
